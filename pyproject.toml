[project]
name = "tmux-mcp"
version = "0.1.0"
description = "MCP server that lets an AI agent type into a live tmux pane you can watch"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27,<2",
]

[dependency-groups]
dev = ["ruff", "ty"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",        # pydocstyle: docstrings are written for the model reading the tool, not pydocstyle
    "COM812",   # formatter conflict
    "ISC001",   # formatter conflict
    "CPY001",   # the LICENSE file is the copyright notice
    "TRY003",   # error text is the tool's reply to the model, so it is written inline...
    "EM101",    # ...and assigning it to a variable first adds a line for nothing
    "EM102",
    "S603",     # every subprocess is `tmux` from PATH with a list of arguments, never a shell
    "S607",
    "ASYNC109", # `timeout` is the tool parameter the model sets
    "ASYNC221", # tmux calls are millisecond-long local commands; the event loop is not shared
    "ASYNC240",
    "FBT",      # tool booleans are keyword arguments supplied by the model
]

[tool.ruff.lint.per-file-ignores]
"test_server.py" = [
    "S101",    # assert narrows a type in a test
    "T201",    # the test reports through print
    "PLR0915", # one linear script of checks
    "PLR2004", # expected values are literal on purpose
    "S108",    # /tmp is a probe for the cwd option, nothing is written there
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python-version = "3.11"
